<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>被子植物解剖圖集 · Angiosperm atlas</title>
  <style>
    :root { --bg:#0b0d11; --panel:#10151c; --ink:#e8eef4; --muted:#8b9bb0; --line:#243044; --acc:#7ec8a3; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif; }
    #app { display:grid; grid-template-columns:250px 1fr 360px; height:100%; }
    aside, .info { background:var(--panel); overflow:auto; padding:16px 14px 28px; }
    aside { border-right:1px solid var(--line); }
    .info { border-left:1px solid var(--line); }
    h1 { font-size:15px; font-weight:650; line-height:1.35; }
    .sub { font-size:11px; color:var(--muted); margin:6px 0 14px; line-height:1.45; }
    .group { margin-bottom:16px; }
    .group h2 { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--acc); margin-bottom:8px; }
    button.nav { display:block; width:100%; text-align:left; background:transparent; color:var(--ink);
      border:1px solid transparent; border-radius:8px; padding:8px 10px; margin-bottom:3px; cursor:pointer; font-size:13px; }
    button.nav:hover { background:#18202c; }
    button.nav.active { background:#1b2a28; border-color:#2f5a4a; color:#c8f0dc; }
    #stage { position:relative; background:#07090d; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #plateWrap { position:relative; max-width:100%; max-height:100%; }
    #plate { display:block; max-width:100%; max-height:100vh; object-fit:contain; user-select:none; }
    .hot {
      position:absolute; border:1.5px solid rgba(180,230,210,.0); border-radius:10px; cursor:pointer;
      background:rgba(80,180,140,0);
    }
    .hot:hover, .hot.on { border-color:rgba(160,230,200,.85); background:rgba(90,200,150,.12); }
    .pin {
      position:absolute; transform:translate(-50%,-100%);
      background:rgba(10,16,22,.82); color:#eaf6f0; font-size:11px; padding:3px 7px;
      border-radius:6px; border:1px solid #3a5a50; pointer-events:none; white-space:nowrap;
    }
    .info h2 { font-family:Georgia,"Noto Serif TC",serif; font-size:20px; margin:6px 0 10px; }
    .badge { display:inline-block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
      background:#1e3340; color:#9fd4c0; padding:3px 7px; border-radius:99px; }
    .info p { font-size:14px; line-height:1.6; color:#d5deea; margin-bottom:10px; font-family:Georgia,"Noto Serif TC",serif; }
    .info ul { margin:0 0 12px 18px; font-size:13.5px; line-height:1.55; color:#c5d0de; }
    .cell-card { background:#151c26; border:1px solid #2a3a4c; border-radius:8px; padding:10px; margin-bottom:8px; }
    .cell-card h3 { font-size:13px; margin-bottom:4px; }
    .cell-card p { font-size:12.5px; margin:0; color:#b7c4d4; font-family:inherit; }
    .cite { font-size:11px; color:#7d8ea3; line-height:1.45; border-top:1px solid var(--line); padding-top:10px; margin-top:14px; }
    .note { font-size:12px; color:var(--muted); line-height:1.45; }
    @media (max-width:1100px){ #app{grid-template-columns:210px 1fr;} .info{display:none;} }
  </style>
</head>

<div id="app">

    </div>
    <p class="note">圖係教學重建，細胞形狀同位置跟 Esau／Evert／教科書通例，唔係某一棵真樹嘅照片。</p>
  </aside>
  <div id="stage">
    <div id="plateWrap">
      <img id="plate" alt="anatomy plate" />
    </div>
  </div>
  <section class="info">
    <span class="badge" id="badge"></span>
    <h2 id="title"></h2>
    <div id="body"></div>
  </section>
</div>

      { l:8,t:8,w:84,h:84, name:"表皮＋皮層", note:"最外一圈表皮，內面係皮層薄壁／厚角組織。" }
    ]
  },
  flower: {
    src: "plates/flower.jpg",
    badge: "生殖器官",
    title: "雙子葉花剖開",
    html: `<p>由外到內四輪：花萼、花冠、雄蕊群、雌蕊群。子房切開見到胚珠。花藥切開見到花粉。呢個就係被子植物定義：胚珠包喺子房入面。</p>
    <p class="cite">Raven Biology of Plants；Esau flower。</p>`,
    spots: [
      { l:18,t:8,w:64,h:28, name:"花瓣", note:"花冠，吸引傳粉者。" },
      { l:18,t:38,w:22,h:22, name:"雄蕊／花藥", note:"花藥內有花粉囊。" },
      { l:40,t:28,w:20,h:14, name:"柱頭＋花柱", note:"接受花粉，花粉管向下長。" },
      { l:36,t:46,w:28,h:28, name:"子房＋胚珠", note:"胚珠之後發育成種子，子房壁成果皮。" }

const wrap = document.getElementById("plateWrap");
const img = document.getElementById("plate");
let current = "leaf";

function setPlate(id) {
  current = id;
  const p = PLATES[id];
  document.querySelectorAll("button.nav").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  document.getElementById("badge").textContent = p.badge;
  document.getElementById("title").textContent = p.title;
  document.getElementById("body").innerHTML = p.html;
  img.src = p.src;
  wrap.querySelectorAll(".hot,.pin").forEach(n => n.remove());
}

img.addEventListener("load", () => {
  const p = PLATES[current];
  (p.spots || []).forEach(s => {
    const h = document.createElement("button");
    h.className = "hot";
    h.style.left = s.l + "%"; h.style.top = s.t + "%";
    h.style.width = s.w + "%"; h.style.height = s.h + "%";
    h.title = s.name;
    h.onclick = () => {
      wrap.querySelectorAll(".hot").forEach(x => x.classList.remove("on"));
      h.classList.add("on");
      document.getElementById("badge").textContent = "選中";
      document.getElementById("title").textContent = s.name;
      document.getElementById("body").innerHTML = `<p>${s.note}</p>` + p.html;
    };
    wrap.appendChild(h);
    const pin = document.createElement("div");
    pin.className = "pin";
    pin.textContent = s.name;
    pin.style.left = (s.l + s.w/2) + "%";
    pin.style.top = s.t + "%";
    wrap.appendChild(pin);
  });
});

document.querySelectorAll("button.nav").forEach(b => b.addEventListener("click", () => setPlate(b.dataset.id)));
setPlate("leaf");
</script>
</body>
</html>
